apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend-api
  labels:
    app: claims-backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-backend-api
  template:
    metadata:
      labels:
        app: claims-backend-api
    spec:
      containers:
        - name: api
          image: claims-backend-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: CLAIMS_TOPIC
              value: "claims.submitted"
            - name: ORCHESTRATION_BASE_URL
              value: "http://claims-backend-orchestration:8081"
            - name: SERVER_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claims-backend-api
spec:
  selector:
    app: claims-backend-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP

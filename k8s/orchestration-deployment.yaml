apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend-orchestration
  labels:
    app: claims-backend-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-backend-orchestration
  template:
    metadata:
      labels:
        app: claims-backend-orchestration
    spec:
      containers:
        - name: orchestration
          image: claims-backend-orchestration:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: CLAIMS_TOPIC
              value: "claims.submitted"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "claimsdb"
            - name: DB_USER
              value: "claims"
            - name: DB_PASSWORD
              value: "claims"
            - name: SERVER_PORT
              value: "8081"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: claims-backend-orchestration
spec:
  selector:
    app: claims-backend-orchestration
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
